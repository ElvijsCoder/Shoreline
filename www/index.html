<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shoreline</title>

<style>
@font-face{font-family:"Doto";src:url(doto.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:"Space Grotesk";src:url(sg400.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Space Grotesk";src:url(sg500.woff2) format("woff2");font-weight:500}
:root{--bg:#000;--foam:#f3f3ef;--dim:#8d8d88;--line:#303030;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#000;color:var(--foam);font:400 15px/1.45 "Space Grotesk",system-ui,sans-serif;overflow-x:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1;max-width:440px;margin:0 auto;min-height:100%;padding:20px 20px 28px;display:flex;flex-direction:column;gap:20px}
.dot{font-family:"Doto","Courier New",monospace;font-weight:900}
header{display:flex;justify-content:space-between;align-items:baseline}
header b{font-size:26px;letter-spacing:.08em}
header span{color:var(--dim)}
.ringbox{position:relative;width:min(78vw,320px);aspect-ratio:1;margin:4px auto 0}
.ringbox svg{width:100%;height:100%}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 22%}
.mid .big{font-size:52px;line-height:1}
.mid .sub{color:var(--dim);margin-top:6px}
.fact{min-height:3.9em;text-align:center;color:#d6d6d1;max-width:34ch;margin:0 auto}
.row{display:flex;gap:10px}
button,select,input{font:inherit;color:var(--foam)}
.btn{flex:1;padding:16px 0;border-radius:999px;border:1px solid #242424;cursor:pointer;
background:#121212;box-shadow:0 0 0 #0000;transition:transform .12s,background .35s,box-shadow .35s,border-color .35s}
.btn:active{transform:scale(.96);background:#1b1b1b}
[hidden]{display:none!important}
#hist{position:fixed;inset:0;z-index:5;background:#000;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px 28px}
.hw{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.hh{display:flex;justify-content:space-between;align-items:center}.hh b{font-size:26px}
header .btn.sm,.hh .btn.sm{flex:0 0 auto;padding:10px 28px}
.btn.sm.on{color:var(--foam);border-color:#f3f3ef66}
#hist svg{width:100%;display:block}
.btn{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#drink{text-align:center;text-align-last:center}
*{-webkit-tap-highlight-color:transparent}
.btn.glow{background:#1b1b1b;border-color:#f3f3efaa;box-shadow:0 0 22px #f3f3ef66}
circle{transition:fill .3s}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--foam);outline-offset:2px}
.btn.sm{padding:10px 0;color:var(--dim)}
select,input{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#0a0a0acc}
.panel{border:1px solid var(--line);border-radius:18px;padding:16px;background:#050505dd;display:none;gap:12px;flex-direction:column}
.panel.on{display:flex}
label{display:flex;flex-direction:column;gap:4px;color:var(--dim)}
.note{color:var(--dim);font-size:13px}
.log{color:var(--dim);font-size:13px;text-align:center}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style></head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<main>
  <header><b class="dot">Shoreline</b><button class="btn sm" id="hb">History</button></header>
  <div class="ringbox">
    <svg viewBox="0 0 300 300" id="ring" aria-hidden="true"></svg>
    <div class="mid" role="status" aria-live="polite">
      <div class="big dot" id="pct">0%</div>
      <div class="sub" id="left"></div>
      <div class="sub" id="caf" style="font-size:12px;margin-top:2px"></div>
    </div>
  </div>
  <p class="fact" id="fact"></p>
  <div id="chkw" hidden><p class="note" style="text-align:center;margin:0 0 8px">Morning check: urine colour?</p><div class="row"><button class="btn sm" data-u="1">Pale</button><button class="btn sm" data-u="2">Yellow</button><button class="btn sm" data-u="3">Dark</button></div></div>
  <label>Drink
    <select id="drink"></select>
  </label>
  <div class="row">
    <button class="btn" data-ml="150">+150</button>
    <button class="btn" data-ml="250">+250</button>
    <button class="btn" data-ml="500">+500</button>
    <button class="btn" id="cust">Custom</button>
  </div>
  <button class="btn sm" id="lc" hidden></button>
  <div class="row" id="custrow" hidden>
    <input id="cml" type="number" min="1" max="3000" inputmode="numeric" placeholder="ml">
    <button class="btn" id="cadd" style="flex:0 0 38%">Add</button>
  </div>
  <div class="row">
    <button class="btn sm" id="undo">Undo (hold to clear)</button>
    <button class="btn sm" id="setup">Goal settings</button>
  </div>
  <div class="panel" id="panel">
    <div class="g2">
      <label>Sex<select id="sex"><option value="m">Male</option><option value="f">Female</option></select></label>
      <label>Birth year<input id="by" type="number" min="1920" max="2012" inputmode="numeric"></label>
      <label>Weight (kg)<input id="kg" type="number" min="30" max="200" inputmode="numeric"></label>
      <label>Body fat % (optional)<input id="bf" type="number" min="5" max="60" inputmode="numeric" placeholder="optional"></label>
      <label>Activity<select id="act"><option value="0">Mostly sitting</option><option value="1">Light movement</option><option value="2">Active</option><option value="3">Athlete / hard training</option></select></label>
      <label>Temperature (°C)<input id="temp" type="number" min="-30" max="45" inputmode="numeric"></label>
      <label>Humidity (%)<input id="rh" type="number" min="0" max="100" inputmode="numeric"></label>
      <label>Altitude (m)<input id="alt" type="number" min="0" max="5000" inputmode="numeric"></label>
      <label id="prl">Pregnancy / nursing<select id="pr"><option value="0">No</option><option value="1">Late pregnancy</option><option value="2">Nursing</option></select></label>
      <label>Wake up<input id="wake" type="time"></label>
      <label>Sleep<input id="slp" type="time"></label>
      <label>Reminders every<select id="iv"><option value="60">1 hour</option><option value="90">1.5 hours</option><option value="120">2 hours</option></select></label>
      <label>No caffeine after<input id="cut" type="time"></label>
    </div>
    <p class="note" id="why"></p>
    <p class="note" id="wxs"></p>
    <p class="note">Sources: Yamada et al., Science 2022 (water turnover); EFSA 2015 (caffeine); Armstrong et al., J Nutr 2012 (mild dehydration). Other tips are general physiology.</p>
    <button class="btn sm" id="wxb">Update weather now</button>
    <div class="row"><button class="btn sm" id="bx">Export backup</button><button class="btn sm" id="bi">Import backup</button></div>
    <input type="file" id="impf" accept="application/json,.json" hidden>
    <p class="note" id="bst"></p>
  </div>
  <p class="log" id="log"></p>
  <div id="hist" hidden><div class="hw">
    <div class="hh"><b class="dot">History</b><button class="btn sm" id="hx">Close</button></div>
    <div class="row"><button class="btn sm on" id="tw">Week</button><button class="btn sm" id="tm">Month</button></div>
    <svg id="chart" viewBox="0 0 360 205" role="img" aria-label="Daily intake chart"></svg>
    <p class="note" id="hs"></p>
    <b class="dot" id="mn" style="font-size:20px"></b>
    <svg id="cal" viewBox="0 0 360 260" role="img" aria-label="Month calendar"></svg>
  </div></div>
</main>
<script>
const $=s=>document.querySelector(s);
const DR=[["Water",1,0],["Coffee",1,40],["Tea",1,20],["Diet cola",1,12],["Milk",1.1,0],["Juice",1.05,0]];

const FACTS=[
 ["About 1.4% body water loss lowered mood and brought on headaches in a study of young women.","In young men, mild dehydration raised fatigue and tension and made mental tasks harder."],
 ["Water carries nutrients and helps cool you through sweat.","Roughly half or more of an adult's body weight is water."],
 ["Pale yellow urine is a simple sign you are well hydrated.","Food supplies about a fifth of your daily water."],
 ["Kidneys clear roughly a litre an hour at most. Steady sipping beats chugging.","The body cannot bank extra water, so spread it across the day."],
 ["Goal reached. Extra water beyond this is mostly passed straight out.","Done for today. From here, thirst and urine colour are your guide."]];
const KEY="watr-proto-1",today=new Date().toLocaleDateString("sv-SE");
let S={kg:75,sex:"m",by:1990,bf:"",act:1,temp:10,rh:60,alt:0,pr:0,wake:"08:00",slp:"22:30",cut:"14:00",iv:90,lc:0,adj:0,ck:[],day:today,log:[]};
try{const r=JSON.parse(localStorage.getItem(KEY));if(r)S=Object.assign(S,r)}catch(e){}
if(S.day!==today){S.day=today;S.log=[]}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const PAL=[1.4,1.6,1.8,2.2];
const wt=()=>{const a=new Date().getFullYear()-S.by,pal=PAL[S.act],ath=S.act===3?1:0,t=S.temp,x=S.sex==="f"?[0,670,260][S.pr]:0;
 return (S.bf>0?861.9*pal+37.34*S.kg*(1-S.bf/100)+4.288*S.rh+699.7*ath+0.514*S.alt-0.3625*a*a+29.42*a+1.937*t*t-23.15*t-984.8:1076*pal+14.34*S.kg+374.9*(S.sex==="m"?1:0)+5.823*S.rh+1070*ath+0.4726*S.alt-0.3529*a*a+24.78*a+1.865*t*t-19.66*t-713.1)+x};
const goal=()=>Math.min(5500,Math.max(1000,Math.round(wt()*0.85*0.8*(1+(S.adj||0))/50)*50));
const cap=()=>S.sex==="f"&&S.pr>0?200:Math.min(400,Math.round(5.7*S.kg/10)*10);
const hh=s=>{const a=String(s).split(":");return +a[0]+(+a[1]||0)/60};
const eff=()=>Math.round(S.log.reduce((a,e)=>a+e.ml*e.f,0));
let H={};try{H=JSON.parse(localStorage.getItem("watr-hist-1"))||{}}catch(e){}
function hsave(){if(eff()>0||H[S.day]){H[S.day]={e:eff(),g:goal()};try{localStorage.setItem("watr-hist-1",JSON.stringify(H))}catch(e){}}}
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;

// ring of dots
const ring=$("#ring"),N=60,dots=[];
for(let i=0;i<N;i++){const a=i/N*2*Math.PI-Math.PI/2,d=document.createElementNS("http://www.w3.org/2000/svg","circle");
 d.setAttribute("cx",150+122*Math.cos(a));d.setAttribute("cy",150+122*Math.sin(a));d.setAttribute("r",4.2);ring.appendChild(d);dots.push(d)}

let P=0,target=0,surge=0,shown=0,want=0,shown2=0,want2=0,shownR=0,wantR=0;
const M=40,idots=[],NS="http://www.w3.org/2000/svg",ig=document.createElementNS(NS,"g");
ig.style.transition="opacity .6s";ig.style.opacity=0;ring.appendChild(ig);
for(let i=0;i<M;i++){const a=i/M*2*Math.PI-Math.PI/2,d=document.createElementNS(NS,"circle");
 d.setAttribute("cx",150+106*Math.cos(a));d.setAttribute("cy",150+106*Math.sin(a));d.setAttribute("r",2.8);ig.appendChild(d);idots.push(d)}
function render(){
 const g=goal(),e=eff(),p=e/g;target=Math.min(p,1);
 want=Math.round(N*Math.min(p,1));
 const cf=S.log.reduce((a,e)=>a+e.ml*(e.c||0)/100,0);want2=Math.round(M*Math.min(cf/cap(),1));wantR=Math.round(M*Math.min(Math.max(cf-cap(),0)/cap(),1));$("#caf").style.color=cf>cap()?"#ff3b30":"";
 ig.style.opacity=cf>0?1:0;$("#caf").textContent=cf>0?"caffeine "+Math.round(cf)+" / "+cap()+" mg":"";
 if(reduce){shown=want;shown2=want2;shownR=wantR}paint();
 $("#pct").textContent=Math.round(p*100)+"%";
 $("#prl").hidden=S.sex!=="f";
 $("#lc").hidden=!S.lc;$("#lc").textContent="+"+S.lc+" ml (last custom)";
 $("#chkw").hidden=!(new Date().getHours()<12&&!(S.ck||[]).some(x=>x.d===S.day));
 $("#why").textContent="Goal "+g+" ml. Based on a water turnover of about "+(wt()/1000).toFixed(1)+" L/day from the 2022 Yamada et al. Science equation. About 85% of turnover is water you take in, and I assume a fifth of that comes from food. The equation explains just under half of person-to-person variation, so treat it as a starting point."+(S.adj?" Your morning checks adjust it by "+Math.round(S.adj*100)+"%.":"")+" Caffeine limit "+cap()+" mg a day (EFSA 2015: 5.7 mg per kg of body weight, up to 400 mg, or 200 mg in pregnancy and nursing).";
 $("#left").textContent=e>=g?"goal reached":(g-e)+" ml left";
 $("#fact").textContent=tip(p,cf);
 $("#log").textContent=S.log.length?S.log.length+" drinks · "+e+" of "+g+" ml":"Nothing logged yet today";
 save();lbl();sync();hsave();if(reduce)draw();clearTimeout(window._pt);window._pt=setTimeout(plan,1500);
}
function paint(){dots.forEach((d,i)=>d.setAttribute("fill",i<shown?"#f3f3ef":"#2c2c2c"));
 idots.forEach((d,i)=>d.setAttribute("fill",i<shownR?"#ff3b30":i<shown2?"#b4b4af":"#1e1e1e"))}
setInterval(()=>{let m=0;if(shown!==want){shown+=shown<want?1:-1;m=1}
 if(shown2!==want2){shown2+=shown2<want2?1:-1;m=1}
 if(shownR!==wantR&&(shown2===M||shownR>wantR)){shownR+=shownR<wantR?1:-1;m=1}if(m)paint()},75);
document.addEventListener("click",e=>{const b=e.target.closest(".btn");if(b){b.classList.add("glow");setTimeout(()=>b.classList.remove("glow"),380)}});

 const play=()=>{const t=ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=buf;f.type="lowpass";f.frequency.value=2800;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.3,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+.3);
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t)};
 if(buf)play();else ac.decodeAudioData(b2a(SND)).then(b=>{buf=b;play()})}catch(e){}}
const buzz=p=>{const seq=Array.isArray(p)?p.map((d,i)=>i%2?Math.max(d,50):Math.max(d,30)):[40];
 try{if(navigator.vibrate&&navigator.vibrate(seq))return}catch(e){}
 const H=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Haptics;if(!H)return;
 let t=0;seq.forEach((d,k)=>{if(k%2===0)setTimeout(()=>{try{H.vibrate({duration:d})}catch(e){}},t);t+=d})};

DR.forEach(([n,f],i)=>{const o=document.createElement("option");o.value=i;o.textContent=n;$("#drink").appendChild(o)});
function add(ml,di,q){if(!(ml>0&&ml<=3000))return;const [n,f,c]=DR[di===undefined?$("#drink").value:di],before=eff()>=goal();
 S.log.push({ml,f,n,c,t:Date.now()});if(c>0)S.cafSeen=true;cleared=null;if(!q){surge=.05;drop()}
 if(!q)buzz(!before&&eff()>=goal()?[20,60,20,60,40]:18);render()}
document.querySelectorAll("[data-ml]").forEach(b=>b.onclick=()=>add(+b.dataset.ml));
$("#cust").onclick=()=>{const r=$("#custrow");r.hidden=!r.hidden;if(!r.hidden)$("#cml").focus()};
$("#cadd").onclick=()=>{const v=+$("#cml").value;if(v>0&&v<=3000)S.lc=v;add(v);$("#cml").value=""};
$("#cml").onkeydown=e=>{if(e.key==="Enter")$("#cadd").click()};
let ht,held=false,cleared=null;const ub=$("#undo");
const lbl=()=>{ub.textContent=!S.log.length&&cleared?"Restore":"Undo (hold to clear)"};
ub.onpointerdown=()=>{held=false;ub.classList.add("glow");ht=setTimeout(()=>{held=true;if(S.log.length){cleared=S.log.slice();S.log=[];buzz([40,80,40,80,120]);render()}},700)};
const unhold=()=>{clearTimeout(ht);ub.classList.remove("glow")};
ub.onpointerup=ub.onpointerleave=ub.onpointercancel=unhold;ub.oncontextmenu=e=>e.preventDefault();
ub.onclick=()=>{if(held){held=false;return}
 if(!S.log.length&&cleared){S.log=cleared;cleared=null;buzz(40)}else if(S.log.pop())buzz([8,40,8]);render()};
$("#setup").onclick=()=>$("#panel").classList.toggle("on");
["sex","by","kg","bf","act","temp","rh","alt","pr","wake","slp","iv","cut"].forEach(k=>{const el=$("#"+k);el.value=S[k];
 el.onchange=()=>{if(["sex","wake","slp","cut"].includes(k))S[k]=el.value;else if(k==="bf"&&el.value==="")S.bf="";else if(el.value!==""&&!isNaN(+el.value))S[k]=+el.value;render()}});

// shoreline canvas
const c=$("#c"),x=c.getContext("2d");let w,h,t=0;
function rs(){const d=devicePixelRatio||1;w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);draw()}
function shore(y){return w*(.1+.72*(P+surge))+Math.sin(y/95+t)*18+Math.sin(y/38-t*1.7)*7}
function draw(){
 x.clearRect(0,0,w,h);
 const g=x.createLinearGradient(0,0,w,0);g.addColorStop(0,"#202224");g.addColorStop(1,"#070707");
 x.beginPath();x.moveTo(0,0);for(let y=0;y<=h;y+=8)x.lineTo(shore(y),y);x.lineTo(0,h);x.closePath();x.fillStyle=g;x.fill();
 [[0,.9,9],[-16,.3,4],[-34,.12,3]].forEach(([o,a,lw])=>{
  x.beginPath();for(let y=0;y<=h;y+=8){const sx=shore(y)+o+Math.sin(y/50+t*1.3+o)*4;y?x.lineTo(sx,y):x.moveTo(sx,y)}
  x.strokeStyle="rgba(243,243,239,"+a+")";x.lineWidth=lw;x.shadowColor="#fff";x.shadowBlur=o?0:16;x.stroke();x.shadowBlur=0});
}
function loop(){t+=.012;P+=(target-P)*.04;surge*=.94;draw();requestAnimationFrame(loop)}
const CP=(window.Capacitor&&Capacitor.Plugins)||{},LN=CP.LocalNotifications;
async function plan(){if(!LN)return;
 try{const pend=await LN.getPending(),old=pend.notifications.filter(n=>n.id<9000);if(old.length)await LN.cancel({notifications:old});
  if(S.cafSeen){const c=hh(S.cut);await LN.schedule({notifications:[{id:9002,channelId:"drink",title:"Caffeine cutoff",body:"Last call for caffeine today. Water from here is easier on your sleep.",schedule:{on:{hour:Math.floor(c),minute:Math.round(c%1*60)},allowWhileIdle:true}}]})}
 }catch(e){}}
async function nativeInit(){if(!LN)return;
 try{await LN.requestPermissions();
  await LN.createChannel({id:"drink",name:"Drink reminders",importance:4,sound:"drop.wav",vibration:true});
  await LN.registerActionTypes({types:[{id:"DRINK",actions:[{id:"add250",title:"+250 ml"},{id:"add500",title:"+500 ml"},{id:"custom",title:"Custom",input:true,inputButtonTitle:"Add",inputPlaceholder:"ml"}]}]});
  LN.addListener("localNotificationActionPerformed",e=>{if(e.actionId==="add250")add(250,0);else if(e.actionId==="add500")add(500,0);else if(e.actionId==="custom")add(+e.inputValue,0);else if(e.notification.id===9001){$("#panel").classList.add("on");$("#kg").focus()}});
  await LN.schedule({notifications:[{id:9001,channelId:"drink",title:"Update your weight",body:"A quick weight check keeps your goal accurate.",schedule:{on:{day:1,hour:9,minute:0},allowWhileIdle:true}}]});
  plan()}catch(e){}}
async function wx(force){const st=m=>{const e=$("#wxs");if(e)e.textContent=m};
 if(force!==true&&Date.now()-(S.wxT||0)<4*3600e3)return;
 try{st("Updating weather...");const G=CP.Geolocation;
  if(G){const pm=await G.requestPermissions({permissions:["coarseLocation"]});if(pm.location==="denied"&&pm.coarseLocation==="denied"){st("Location permission denied. Enter weather by hand or allow location in the app settings.");return}}
  const pos=G?await G.getCurrentPosition({enableHighAccuracy:false,timeout:20000,maximumAge:3600000}):await new Promise((r,j)=>navigator.geolocation.getCurrentPosition(r,j,{timeout:20000}));
  const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude="+pos.coords.latitude+"&longitude="+pos.coords.longitude+"&daily=temperature_2m_mean,relative_humidity_2m_mean&forecast_days=1&timezone=auto"),j=await r.json();
  S.temp=Math.round(j.daily.temperature_2m_mean[0]);S.rh=Math.round(j.daily.relative_humidity_2m_mean[0]);S.alt=Math.max(0,Math.round(j.elevation||0));S.wxT=Date.now();
  ["temp","rh","alt"].forEach(k=>$("#"+k).value=S[k]);
  st("Weather updated "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}));render()}
 catch(e){st("Weather failed: "+((e&&e.message)||JSON.stringify(e)))}}
$("#wxb").onclick=()=>wx(true);
function tip(p,cf){const now=new Date(),hn=now.getHours()+now.getMinutes()/60,w0=hh(S.wake),w1=hh(S.slp),exp=Math.min(1,Math.max(0,(hn-w0)/(w1-w0)));
 const hr=S.log.filter(e=>e.t&&Date.now()-e.t<3600e3).reduce((a,e)=>a+e.ml,0),last=S.log[S.log.length-1];
 const late=S.log.some(e=>{if(!(e.c>0&&e.t))return false;const d=new Date(e.t);return d.getHours()+d.getMinutes()/60>=hh(S.cut)});
 if(hr>1000)return "That is a lot in one hour. Kidneys clear about a litre an hour at most, so pause for a while.";
 if(p>1.5)return "Well past your goal. No more water is needed today.";
 if(cf>cap())return "You are over today's caffeine limit. Stick to water for the rest of the day.";
 if(last&&last.c>0&&Date.now()-last.t<6e5&&last.ml*last.c/100>Math.min(200,3*S.kg))return "That is a big single dose of caffeine. Up to about 200 mg at once is considered fine.";
 if(late)return "Caffeine this late can cost you sleep. Even 100 mg close to bedtime can affect it.";
 if(S.temp>=25&&p<1)return "Hot day: your goal is raised. Sip steadily rather than all at once.";
 if(p<1&&hn>w0&&hn<w1&&exp-p>.2)return "Behind pace for this time of day. A glass now catches you up.";
 return FACTS[p>=1?4:p>=.75?3:p>=.5?2:p>=.25?1:0][now.getDate()%2]}
$("#lc").onclick=()=>add(S.lc);
document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{S.ck=(S.ck||[]).concat({d:S.day,v:+b.dataset.u}).slice(-7);
 const m=S.ck.reduce((a,x)=>a+x.v,0)/S.ck.length;S.adj=S.ck.length<3?0:m>=2.5?.1:m>=2.1?.05:m<=1.2?-.05:0;buzz(30);render()});
function sync(){const P=CP.Preferences,W=CP.WidgetRefresh;if(!P)return;
 const hr=S.log.filter(e=>e.t&&Date.now()-e.t<3600e3).reduce((a,e)=>a+e.ml,0);
 Promise.all([["sl_day",S.day],["sl_eff",""+eff()],["sl_goal",""+goal()],["sl_wake",S.wake],["sl_slp",S.slp],["sl_iv",""+S.iv],["sl_pause",hr>1000?""+(Date.now()+2*3600e3):"0"]].map(([key,value])=>P.set({key,value}))).then(()=>W&&W.refresh()).catch(()=>{})}
async function pull(){const P=CP.Preferences;if(!P)return;
 try{const r=await P.get({key:"sl_pending"}),n=parseInt(r.value||"0");if(n>0){await P.set({key:"sl_pending",value:"0"});add(n,0,true)}}catch(e){}}
const bst=m=>{$("#bst").textContent=m};
async function exportData(){const data=JSON.stringify({v:1,S,H}),F=CP.Filesystem,Sh=CP.Share;
 try{if(F&&Sh){const name="shoreline-backup-"+S.day+".json";await F.writeFile({path:name,data,directory:"CACHE",encoding:"utf8"});
   const u=await F.getUri({path:name,directory:"CACHE"});await Sh.share({title:"Shoreline backup",files:[u.uri]});bst("Backup ready to save or send.")}
  else{await navigator.clipboard.writeText(data);bst("Backup copied to the clipboard.")}}catch(e){bst("Export failed: "+((e&&e.message)||e))}}
$("#bx").onclick=exportData;
$("#bi").onclick=()=>$("#impf").click();
$("#impf").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.S&&!d.H)throw new Error("not a Shoreline backup");
  Object.assign(H,d.H||{});if(d.S){["kg","sex","by","bf","act","temp","rh","alt","pr"].forEach(k=>{if(d.S[k]!==undefined)S[k]=d.S[k]});if(d.S.day===S.day&&Array.isArray(d.S.log))S.log=d.S.log}
  try{localStorage.setItem("watr-hist-1",JSON.stringify(H))}catch(x){}
  ["sex","by","kg","bf","act","temp","rh","alt","pr"].forEach(k=>$("#"+k).value=S[k]);render();bst("Imported "+Object.keys(d.H||{}).length+" days of history.")}
  catch(x){bst("Import failed: "+x.message)}e.target.value=""};r.readAsText(f)};
let HM="w";
function hist(){const NS="http://www.w3.org/2000/svg",n=HM==="w"?7:30,ds=[];
 for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);ds.push(d.toLocaleDateString("sv-SE"))}
 const vs=ds.map(k=>H[k]||null),mx=Math.max(goal(),...vs.map(v=>v?Math.max(v.e,v.g):0));
 const mk=(svg,t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e};
 const ch=$("#chart");ch.innerHTML="";const cw=360/n,rows=22,r=Math.min(cw*.3,5);
 ds.forEach((k,i)=>{const v=vs[i],f=Math.round((v?v.e/mx:0)*rows),x=cw*i+cw/2;
  for(let j=0;j<rows;j++)mk(ch,"circle",{cx:x,cy:176-j*(160/rows),r,fill:j<f?"#f3f3ef":"#1f1f1f"});
  if(n===7)mk(ch,"text",{x,y:200,"text-anchor":"middle","font-size":11,fill:"#8d8d88"}).textContent=new Date(k+"T12:00").toLocaleDateString(undefined,{weekday:"short"})});
 const gy=176-160*goal()/mx;mk(ch,"line",{x1:0,x2:360,y1:gy,y2:gy,stroke:"#f3f3ef88","stroke-dasharray":"3 5"});
 const rc=vs.filter(Boolean);
 $("#hs").textContent=rc.length?"Average "+Math.round(rc.reduce((a,v)=>a+v.e,0)/rc.length)+" ml a day, goal met "+rc.filter(v=>v.e>=v.g).length+" of "+rc.length+" days, best "+Math.max(...rc.map(v=>v.e))+" ml. Dashed line is today's goal.":"No data yet. Your history builds up from today.";
 const now=new Date(),y=now.getFullYear(),m=now.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),cl=360/7;
 $("#mn").textContent=now.toLocaleDateString(undefined,{month:"long",year:"numeric"});
 const cal=$("#cal");cal.innerHTML="";
 "MTWTFSS".split("").forEach((c,i)=>mk(cal,"text",{x:cl*i+cl/2,y:12,"text-anchor":"middle","font-size":11,fill:"#8d8d88"}).textContent=c);
 for(let d=1;d<=dim;d++){const idx=off+d-1,x=(idx%7)*cl+cl/2,yy=36+Math.floor(idx/7)*38,dt=new Date(y,m,d),v=H[dt.toLocaleDateString("sv-SE")],fr=v?v.e/v.g:null;
  const fut=dt>now&&dt.toDateString()!==now.toDateString();
  const [fc,rr]=fut?["#141414",3]:fr===null?["#1c1c1c",4]:fr<.5?["#4a4a4a",6]:fr<.8?["#8a8a86",7]:fr<1?["#cfcfca",8]:["#f3f3ef",9];
  mk(cal,"circle",{cx:x,cy:yy,r:rr,fill:fc});
  if(dt.toDateString()===now.toDateString())mk(cal,"circle",{cx:x,cy:yy,r:13,fill:"none",stroke:"#f3f3ef",opacity:.7})}}
$("#hb").onclick=()=>{$("#hist").hidden=false;hist()};
$("#hx").onclick=()=>{$("#hist").hidden=true};
[["tw","w"],["tm","m"]].forEach(([id,k])=>$("#"+id).onclick=()=>{HM=k;$("#tw").classList.toggle("on",k==="w");$("#tm").classList.toggle("on",k==="m");hist()});
addEventListener("resize",rs);rs();render();
if(!reduce){P=0;loop()}else{P=target;draw()}
nativeInit().then(()=>{wx();pull()});document.addEventListener("visibilitychange",()=>{if(!document.hidden){wx();plan();pull()}});
