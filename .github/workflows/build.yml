name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Exact versions from package-lock.json, so every build uses the same code.
      - run: npm ci

      # The goal, caffeine and day-window math must pass before anything is built.
      - run: npm test

      - run: npx cap add android
      - run: sh scripts/patch.sh
      - run: npx cap sync android

      - name: Build APK
        run: |
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk "../Shoreline-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Shoreline-${{ github.run_number }}
          path: Shoreline-${{ github.run_number }}.apk

      # A release per build. Full releases (not pre-releases) so Obtainium picks them up,
      # tagged with the same version the APK reports (1.1.N) so it can tell what's newer.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Shoreline 1.1.${{ github.run_number }}
          prerelease: false
          make_latest: true
          files: Shoreline-${{ github.run_number }}.apk
